# Reviewed evaluation set for automatic word corrections (spec 023,
# research R10). It is used by `python -m src.tools.eval_corrections`,
# which needs DASHSCOPE_API_KEY, so pytest only checks that the file is
# consistent (tests/unit/test_eval_corrections.py).
#
# kind: correct     a word whose values are right: it must not be made
#                   worse (SC-002, at most 5% of these).
# kind: known_error one field (`error`) is wrong: the check must fix it
#                   (SC-001, at least 90% of these).
# sent:     the values sent to Qwen.
# accepted: the right values. `ipa` lists acceptable forms in the
#           dialect's Oxford Learner's Dictionaries style; `chinese_any`
#           lists core meanings, one of which must appear in the answer;
#           an answer's parts of speech must all be in pos + pos_ok and
#           include one of pos.
# British words and values come from the shared sets (spec 017); American
# ones from tests/fixtures/enrichment_eval.yml (spec 018, reviewed
# 2026-10-03). Heteronyms (upset, wound, record, present, contract) keep
# their sent IPA by design. The errors were made by hand: another word's
# meaning (often a look-alike: zealous/jealous, weave/wave), a wrong part
# of speech, or a wrong IPA (the other dialect, another word's, or the
# wrong stress).
# Written 2026-10-21; to be reviewed by the user before the eval gate.
