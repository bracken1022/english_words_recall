# Merriam-Webster attests for the word (added 2026-10-03, when the IPA
# source became the CMU dictionary). `chinese_any` lists accepted core
# glosses: an answer counts if any one of them appears inside one of its
# "；" parts.
# Reviewed 2026-10-03. `pos` / `pos_ok` added 2026-10-05 (spec 019 R6):
# a reply's labels must all be in pos ∪ pos_ok and include one of pos.
