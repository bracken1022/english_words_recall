<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Tutor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main id="app">
    <div class="sheet">
      <div class="sheet__content">
        <p class="letterhead">English Tutor</p>

        <div id="warnings" class="warnings" hidden></div>

        <section id="choose-view" hidden>
          <p class="prose">Which words do you want to practice?</p>
          <fieldset class="order-toggle">
            <legend>Order</legend>
            <label><input type="radio" name="order-choice" value="sequential" checked> Sequential</label>
            <label><input type="radio" name="order-choice" value="random"> Random</label>
          </fieldset>
          <fieldset class="order-toggle">
            <legend>Mode</legend>
            <label><input type="radio" name="mode-choice" value="sentence" checked> Sentence</label>
            <label><input type="radio" name="mode-choice" value="recall-only"> Recall only</label>
          </fieldset>
          <div id="choose-list" class="choose-list"></div>
        </section>

        <section id="empty-view" hidden>
          <p class="prose">No words are waiting. Add some to the vocabulary folder to start a session.</p>
        </section>

        <section id="complete-view" hidden>
          <div class="stamp stamp--done" aria-hidden="true">done</div>
          <p class="prose">Session complete — you've gone through every word.</p>
          <p id="session-tally" class="prose"></p>
          <button id="restart-button" type="button" hidden>Practice again</button>
        </section>

        <section id="recall-view" hidden>
          <p class="meaning"><span id="chinese"></span></p>
          <form id="answer-form">
            <label for="answer-input">Write the English word</label>
            <div class="field-row">
              <input id="answer-input" name="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button type="submit">Check</button>
            </div>
          </form>
        </section>

        <p id="word-feedback" aria-live="polite" hidden></p>

        <section id="sentence-view" hidden>
          <p class="prose">Write a sentence using</p>
          <p class="target-slot"><span id="target-expression"></span></p>
          <form id="sentence-form">
            <label for="sentence-input">Your sentence</label>
            <div class="field-row">
              <input id="sentence-input" name="sentence" type="text" autocomplete="off" spellcheck="false">
              <button type="submit">Review</button>
            </div>
          </form>
          <button id="mic-button" type="button" class="mic-button" hidden>Speak instead</button>
          <div id="transcribing" class="spinner" hidden aria-live="polite"><span class="spinner__dot" aria-hidden="true"></span>Transcribing...</div>
          <div id="spinner" class="spinner" hidden aria-live="polite"><span class="spinner__dot" aria-hidden="true"></span>Reviewing your sentence...</div>
        </section>

        <section id="feedback-view" hidden>
          <div id="feedback-result" aria-live="polite"></div>
        </section>

        <button id="continue-button" type="button" hidden>Continue</button>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
